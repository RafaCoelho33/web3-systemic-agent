# Smithery MCP Server Manifest
# https://smithery.ai/docs/config#smitheryyaml

name: "web3-systemic-agent"
version: "1.0.2"
description: "Autonomous Web3 Security and Governance Auditor MCP Server with free Stage 1 on-chain inspection and x402 paid Stage 2 Gemini LLM audits ($0.015 standard / $0.25 deep)."

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      web3AgentUrl:
        type: string
        description: "Public URL of the Web3 Condition-Action Trigger Agent service (injected as WEB3_AGENT_URL)"
        default: "https://web3-systemic-agent.onrender.com"
      x402BuyerPrivateKey:
        type: string
        description: "Optional EVM private key with USDC on Base to automate paid Stage 2 deep semantic audits (injected as X402_BUYER_PRIVATE_KEY)"
  env:
    WEB3_AGENT_URL: "${web3AgentUrl}"
    X402_BUYER_PRIVATE_KEY: "${x402BuyerPrivateKey}"
    MCP_EXECUTION_MODE: "remote"
  commandFunction:
    python: "python -m src.mcp_server"
